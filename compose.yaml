# Local development:  cd apps/backend && ./mvnw spring-boot:run   (starts only "postgres" automatically)
#                     cd apps/users && ./mvnw spring-boot:run     (uses the same "postgres")
# Full stack:         JWT_SECRET=... docker compose --profile app up --build   -> http://localhost:8080
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hbt
      POSTGRES_USER: hbt
      POSTGRES_PASSWORD: hbt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbt -d hbt"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [app]
    build: apps/backend
    image: household-budget-tracker-backend
    environment: &app-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hbt
      SPRING_DATASOURCE_USERNAME: hbt
      SPRING_DATASOURCE_PASSWORD: hbt
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-do-not-use-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  users:
    profiles: [app]
    build: apps/users
    image: household-budget-tracker-users
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: household-budget-tracker-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      users:
        condition: service_healthy

volumes:
  postgres-data:
