# Local development:  cd backend && ./mvnw spring-boot:run   (starts only "postgres" automatically)
# Full stack:         docker compose --profile app up --build
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hbt
      POSTGRES_USER: hbt
      POSTGRES_PASSWORD: hbt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbt -d hbt"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: [app]
    build: .
    image: household-budget-tracker
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hbt
      SPRING_DATASOURCE_USERNAME: hbt
      SPRING_DATASOURCE_PASSWORD: hbt
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
