spring.application.name=household-budget-tracker

# Datasource is configured via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
# For local development, spring-boot-docker-compose starts PostgreSQL from this file.
spring.docker.compose.file=../compose.yaml

# Health endpoint for container orchestration (/actuator/health, /liveness, /readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# OpenAPI contract, also checked in as ../api/openapi.json (see OpenApiContractTest)
springdoc.api-docs.version=openapi_3_0
springdoc.writer-with-default-pretty-printer=true
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.path=/api/docs
