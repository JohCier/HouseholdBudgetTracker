spring.application.name=household-budget-tracker-users
# Next to the backend on :8080 in local development
server.port=8081

# Datasource is configured via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD; the database is
# shared with apps/backend, but this app keeps its tables in a schema of its own.
# For local development, spring-boot-docker-compose starts PostgreSQL from this file. It is shared
# with apps/backend, so it is left running when one of the apps stops.
spring.docker.compose.file=../../compose.yaml
spring.docker.compose.lifecycle-management=start-only
spring.flyway.schemas=users
spring.flyway.default-schema=users

# Session tokens are signed with this secret (at least 32 bytes), which must be the same in
# apps/backend. No default: the app does not start without JWT_SECRET.
# ./mvnw spring-boot:run and the tests use a development secret from pom.xml.
hbt.auth.jwt-secret=${JWT_SECRET}
# The session cookie is only sent over HTTPS (and to localhost). While the app is served over
# plain HTTP, set HBT_AUTH_SECURE_COOKIE=false.

# Health endpoint for container orchestration (/actuator/health, /liveness, /readiness) and metrics for Prometheus
# (/actuator/prometheus). Neither is reachable from outside: nginx and the ingress only route /api to this app.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# OpenAPI contract, also checked in as ../../packages/shared-types/openapi/users.json (see OpenApiContractTest)
springdoc.api-docs.version=openapi_3_0
springdoc.writer-with-default-pretty-printer=true
springdoc.writer-with-order-by-keys=true
