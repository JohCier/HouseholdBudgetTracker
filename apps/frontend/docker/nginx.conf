# Single entry point of the app: serves the Angular build and routes the API to the services.
# Upstreams are the service names from compose.yaml / compose.prod.yaml.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Text assets and API answers compressed (the Angular bundles shrink to under a third);
    # images and fonts are compressed already.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Registration, sign-in and sessions (apps/users)
    location /api/auth/ {
        proxy_pass http://users:8081;
    }

    # Household plans and their API documentation at /api/docs (apps/backend)
    location /api/ {
        proxy_pass http://backend:8080;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    # Hashed bundles may be cached forever; index.html and favicon.ico (not hashed) never, so new
    # releases show up at once.
    location ~* \.(?:js|css|woff2?|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/login, /register, ...) are all served by index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
