spring.application.name=household-budget-tracker

# Datasource is configured via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
# For local development, spring-boot-docker-compose starts PostgreSQL from this file. It is shared
# with apps/users, so it is left running when one of the apps stops.
spring.docker.compose.file=../../compose.yaml
spring.docker.compose.lifecycle-management=start-only

# Session tokens are issued by apps/users and signed with this secret (at least 32 bytes), which
# must be the same in both apps. No default: the app does not start without JWT_SECRET.
# ./mvnw spring-boot:run and the tests use a development secret from pom.xml.
hbt.auth.jwt-secret=${JWT_SECRET}

# Health endpoint for container orchestration (/actuator/health, /liveness, /readiness) and metrics for Prometheus
# (/actuator/prometheus). Neither is reachable from outside: nginx and the ingress only route /api to this app.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# OpenAPI contract, also checked in as ../../packages/shared-types/openapi/plans.json (see OpenApiContractTest)
springdoc.api-docs.version=openapi_3_0
springdoc.writer-with-default-pretty-printer=true
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.path=/api/docs
