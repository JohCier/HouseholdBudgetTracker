version: 2
updates:
  - package-ecosystem: maven
    # Parent pom.xml in the root, includes the modules apps/backend and apps/users
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
  - package-ecosystem: docker
    directories: [/apps/backend, /apps/users, /apps/frontend]
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
