version: 2
updates:
  - package-ecosystem: maven
    # Parent pom.xml in the root, includes the modules apps/backend and apps/users
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: npm
    # / is the npm workspace (frontend, shared-types); e2e has its own package-lock.json outside the workspace
    directories: [/, /e2e]
    schedule:
      interval: daily
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
  - package-ecosystem: docker
    directories: [/apps/backend, /apps/users, /apps/frontend]
    schedule:
      interval: daily
  # Postgres image in compose.yaml and compose.prod.yaml; the Testcontainers tests read it from compose.yaml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
