name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  java:
    name: ${{ matrix.app }} (build & test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, users]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/${{ matrix.app }}/pom.xml
      # Includes Testcontainers (PostgreSQL) and the OpenAPI contract check against packages/shared-types/openapi
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (build & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # pretest/prebuild generate the API types in packages/shared-types
      - run: npm test --workspace=frontend -- --watch=false
      - run: npm run build --workspace=frontend

  docker:
    name: Build & push ${{ matrix.app }} image
    needs: [java, frontend]
    # Dependabot PRs only run the tests, no image build
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: backend
            context: apps/backend
          - app: users
            context: apps/users
          - app: frontend
            context: .
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: node
        run: echo "version=$(cat apps/frontend/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy
    needs: [docker]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compose-Datei auf den Server kopieren
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: compose.prod.yaml
          target: /opt/hbt

      - name: Neue Version starten
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/hbt
            docker compose -f compose.prod.yaml pull backend users frontend
            # --remove-orphans: drops containers of services that no longer exist (e.g. the former "app")
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f
