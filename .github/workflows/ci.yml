# CI/CD pipeline: tests all apps, builds and pushes Docker images of the changed apps, deploys to the server.
#
# Triggers:
#   push to master       tests, build & push of the changed apps, deploy (only if at least one image was built)
#   push of a tag v*     tests, build & push of all apps (every image gets the semver tag)
#   pull_request         tests, build of the changed apps without push; Dependabot PRs only run the tests
#   workflow_dispatch    like a push on the selected branch, but builds all apps (e.g. after a failed image build,
#                        which the next push would not repeat because the app counts as unchanged then)
#
# Jobs:
#   changes    dorny/paths-filter compares the changed files against the path filters per app
#              (push: previous commit of the branch, pull_request: PR base) and lists the changed apps
#   java       Maven (./mvnw verify) for backend and users, incl. Testcontainers and the OpenAPI contract check
#   frontend   npm: tests and Angular build of the frontend
#   deps-scan  Trivy scans the dependencies (pom.xml, package-lock.json) for known vulnerabilities and the
#              repository for committed secrets
#   sast       Semgrep CE scans the own Java and TypeScript code for insecure patterns (rulesets from semgrep.dev)
#   docker     Docker Buildx builds one image per changed app, Trivy scans it, then it is pushed to ghcr.io
#              (not for pull requests)
#   deploy     copies compose.prod.yaml to the server via SCP and starts the new images via SSH (master only)
#
# Security scans: every scan blocks on CRITICAL/HIGH findings that already have a fix (Trivy: --ignore-unfixed,
# Semgrep: severity ERROR), so a vulnerable image is neither pushed nor deployed. Accepted Trivy findings go into
# .trivyignore (one CVE ID per line, with a comment why). The findings appear in the job log and the job summary.
#
# Variables:
#   needs.changes.outputs.apps     origin: job "changes"; JSON list of the apps to build (e.g. ["backend"]),
#                                  for tags and workflow_dispatch always all apps; matrix of the job "docker"
#   steps.filter.outputs.changes   origin: dorny/paths-filter; JSON list of the filters with changed files
#   matrix.app                     origin: job matrix; app name = directory under apps/ and image name
#   steps.node.outputs.version     origin: apps/frontend/.nvmrc; Node version as build arg NODE_VERSION of the
#                                  frontend image
#   steps.meta.outputs.tags        origin: docker/metadata-action; image tags (latest, sha-<commit>, semver)
#   steps.meta.outputs.labels      origin: docker/metadata-action; OCI labels of the image
#   github.repository, github.actor, github.event_name, github.ref, github.ref_type,
#   github.event.pull_request.user.login
#                                  origin: GitHub Actions context; image path, registry login, conditions
#   github.sha                     origin: GitHub Actions context; tag of the locally built image that Trivy scans
#   GITHUB_STEP_SUMMARY            origin: set by the runner; file whose Markdown content becomes the job summary,
#                                  receives the scan results
#   secrets.GITHUB_TOKEN           origin: provided by GitHub Actions; login to ghcr.io (permission packages: write)
#   secrets.SERVER_HOST            origin: repository secret; host name of the deploy server
#   secrets.SERVER_SSH_KEY         origin: repository secret; private SSH key of the user "deploy" on the server
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter reads the changed files of a pull request via the GitHub API
      pull-requests: read
    outputs:
      apps: ${{ steps.filter.outputs.changes || '["backend","users","frontend"]' }}
    steps:
      - uses: actions/checkout@v7
      # Tags and manual runs build everything, so the filter is skipped and the output falls back to all apps
      - id: filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          # One filter per app: everything that ends up in its image. Changes to this workflow rebuild all apps.
          filters: |
            backend:
              - 'apps/backend/**'
              - '.github/workflows/ci.yml'
            users:
              - 'apps/users/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared-types/**'
              - 'package.json'
              - 'package-lock.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  java:
    name: ${{ matrix.app }} (build & test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, users]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/${{ matrix.app }}/pom.xml
      # Includes Testcontainers (PostgreSQL) and the OpenAPI contract check against packages/shared-types/openapi
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (build & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # pretest/prebuild generate the API types in packages/shared-types
      - run: npm test --workspace=frontend -- --watch=false
      - run: npm run build --workspace=frontend

  deps-scan:
    name: Dependency & secret scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/*/pom.xml
      # Trivy reads the transitive Maven dependencies from ~/.m2. Without this step it downloads them itself and
      # gets blocked by Maven Central (429 Too Many Requests).
      - name: Maven-Abhängigkeiten auflösen
        run: for app in backend users; do (cd "apps/$app" && ./mvnw -B -q dependency:resolve); done
      # Pinned to a commit because the tags of trivy-action were compromised and re-pushed in March 2026
      - name: Trivy (Abhängigkeiten & Secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # .cache holds the Trivy database of the action itself
          skip-dirs: .cache
          exit-code: '1'
          output: trivy-deps.txt
      - name: Ergebnis in die Job-Zusammenfassung
        if: always()
        run: |
          { echo '### Trivy: Abhängigkeiten & Secrets'; echo '```'; cat trivy-deps.txt || echo 'Kein Ergebnis'; echo '```'; } \
            | tee -a "$GITHUB_STEP_SUMMARY"

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@v7
      # Severity ERROR corresponds to CRITICAL/HIGH; --metrics off: no usage data is sent to semgrep.dev
      - run: >-
          semgrep scan --config p/java --config p/typescript --config p/owasp-top-ten
          --severity ERROR --error --metrics off --text-output semgrep.txt
      - name: Ergebnis in die Job-Zusammenfassung
        if: always()
        run: |
          { echo '### Semgrep'; echo '```'; [ -s semgrep.txt ] && cat semgrep.txt || echo 'Keine Funde'; echo '```'; } \
            | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    name: Build, scan & push ${{ matrix.app }} image
    # The scans block the push, so neither a vulnerable image nor vulnerable code is deployed
    needs: [changes, java, frontend, deps-scan, sast]
    # Dependabot PRs only run the tests, no image build; without changed apps the (empty) matrix is skipped
    if: >-
      needs.changes.outputs.apps != '[]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: node
        run: echo "version=$(cat apps/frontend/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Builds the image into the local Docker daemon only, so Trivy can scan it before anything is pushed
      - name: Image lokal bauen
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app == 'frontend' && '.' || format('apps/{0}', matrix.app) }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          load: true
          tags: scan/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
      - name: Trivy (Image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: scan/${{ matrix.app }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          output: trivy-image.txt
      - name: Ergebnis in die Job-Zusammenfassung
        if: always()
        run: |
          { echo '### Trivy: Image ${{ matrix.app }}'; echo '```'; cat trivy-image.txt || echo 'Kein Ergebnis'; echo '```'; } \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # Same inputs as the local build, so all layers come from the builder cache and the image is identical
      - uses: docker/build-push-action@v7
        with:
          # The frontend needs the npm workspace in the repository root, the Java apps use their own directory
          context: ${{ matrix.app == 'frontend' && '.' || format('apps/{0}', matrix.app) }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy
    # Skipped as well when "docker" was skipped, i.e. no image was built
    needs: [docker]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compose-Datei auf den Server kopieren
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: compose.prod.yaml
          target: /opt/hbt

      - name: Neue Version starten
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Unchanged images keep their "latest" tag, pulling them is a no-op
          script: |
            set -e
            cd /opt/hbt
            docker compose -f compose.prod.yaml pull backend users frontend
            # --remove-orphans: drops containers of services that no longer exist (e.g. the former "app")
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f
