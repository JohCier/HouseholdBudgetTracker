# CI/CD pipeline: tests all apps, scans the dependencies for CVEs, builds and pushes the Docker images, deploys to
# the server.
#
# Triggers:
#   push to master       tests, CVE scan, build & push of all apps, deploy
#   push of a tag v*     tests, CVE scan, build & push of all apps (every image gets the semver tag)
#   pull_request         tests, CVE scan, build without push; Dependabot PRs only run the tests and the CVE scan
#   workflow_dispatch    like a push on the selected branch
#
# Jobs:
#   java       Maven (./mvnw verify) for backend and users, incl. Testcontainers and the OpenAPI contract check
#   frontend   npm: tests and Angular build of the frontend
#   cve-scan   Trivy scans the dependencies (pom.xml, package-lock.json) for known vulnerabilities (CVEs). Fails on
#              CRITICAL/HIGH findings that already have a fix, but does not block docker/deploy (informative only).
#              Accepted findings go into .trivyignore in the repository root (one CVE ID per line, with a reason).
#   docker     Docker Buildx builds one image per app and pushes it to ghcr.io (not for pull requests)
#   deploy     copies compose.prod.yaml to the server via SCP and starts the new images via SSH (master only)
#
# Variables:
#   matrix.app                     origin: job matrix; app name = directory under apps/ and image name
#   matrix.context                 origin: job matrix; Docker build context of the app
#   steps.node.outputs.version     origin: apps/frontend/.nvmrc; Node version as build arg NODE_VERSION of the
#                                  frontend image
#   steps.meta.outputs.tags        origin: docker/metadata-action; image tags (latest, sha-<commit>, semver)
#   steps.meta.outputs.labels      origin: docker/metadata-action; OCI labels of the image
#   github.repository, github.actor, github.event_name, github.ref, github.event.pull_request.user.login
#                                  origin: GitHub Actions context; image path, registry login, conditions
#   GITHUB_OUTPUT                  origin: set by the runner; file for step outputs (Node version)
#   GITHUB_STEP_SUMMARY            origin: set by the runner; file whose Markdown content becomes the job summary,
#                                  receives the result of the CVE scan
#   secrets.GITHUB_TOKEN           origin: provided by GitHub Actions; login to ghcr.io (permission packages: write)
#   secrets.SERVER_HOST            origin: repository secret; host name of the deploy server
#   secrets.SERVER_SSH_KEY         origin: repository secret; private SSH key of the user "deploy" on the server
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  java:
    name: ${{ matrix.app }} (build & test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, users]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/${{ matrix.app }}/pom.xml
      # Includes Testcontainers (PostgreSQL) and the OpenAPI contract check against packages/shared-types/openapi
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (build & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # pretest/prebuild generate the API types in packages/shared-types
      - run: npm test --workspace=frontend -- --watch=false
      - run: npm run build --workspace=frontend

  cve-scan:
    name: CVE scan (Trivy)
    # Not listed in docker.needs: a finding turns this job red, but images are still built and deployed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/*/pom.xml
      # Trivy reads the transitive Maven dependencies from ~/.m2. Without this step it downloads them itself and
      # gets blocked by Maven Central (429 Too Many Requests).
      - name: Maven-Abhängigkeiten auflösen
        run: for app in backend users; do (cd "apps/$app" && ./mvnw -B -q dependency:resolve); done
      # Pinned to a commit because the tags of trivy-action were compromised and re-pushed in March 2026
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # .cache holds the Trivy database of the action itself
          skip-dirs: .cache
          exit-code: '1'
          output: trivy.txt
      - name: Ergebnis in die Job-Zusammenfassung
        if: always()
        run: |
          { echo '### Trivy: CVEs in den Abhängigkeiten'; echo '```'; cat trivy.txt || echo 'Kein Ergebnis'; echo '```'; } \
            | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    name: Build & push ${{ matrix.app }} image
    needs: [java, frontend]
    # Dependabot PRs only run the tests, no image build
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: backend
            context: apps/backend
          - app: users
            context: apps/users
          - app: frontend
            context: .
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: node
        run: echo "version=$(cat apps/frontend/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy
    needs: [docker]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compose-Datei auf den Server kopieren
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: compose.prod.yaml
          target: /opt/hbt

      - name: Neue Version starten
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/hbt
            docker compose -f compose.prod.yaml pull backend users frontend
            # --remove-orphans: drops containers of services that no longer exist (e.g. the former "app")
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f
