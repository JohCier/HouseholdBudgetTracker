# CI/CD pipeline: tests the changed apps, scans the dependencies for CVEs, builds and pushes the Docker images of the
# changed apps, deploys to the server. The frontend is only tested, built and E2E-tested if it changed.
#
# Triggers:
#   push to master       tests, CVE scan, build & push of the changed apps, deploy
#   push of a tag v*     tests, CVE scan, build & push of all apps (every image gets the semver tag)
#   pull_request         tests, CVE scan, build without push of the changed apps; Dependabot PRs only run the tests and
#                        the CVE scan
#   workflow_dispatch    like a push on the selected branch, but builds all apps (e.g. to repeat a failed image build,
#                        which the next push would skip because the app counts as unchanged then)
#
# Changed apps: dorny/paths-filter compares the changed files with the filters in the job "changes"
# (push: previous commit of the branch, pull_request: target branch of the PR). Which app was built is visible in the
# job graph of the run (unchanged apps have no job or a skipped one), the log of the filter step lists the changed files
# per app. Skipped jobs count as successful, so required status checks in the branch rules do not block the merge.
#
# Jobs:
#   changes    determines the apps to build
#   java       Maven (./mvnw verify) for the changed Java apps, incl. Testcontainers and the OpenAPI contract check;
#              skipped if no Java app changed
#   frontend   npm: tests and Angular build of the frontend; skipped if the frontend did not change
#   e2e        Playwright (e2e/) drives Chromium through the whole stack from compose.yaml (nginx with the Angular app,
#              backend, users, PostgreSQL), built from the checked-out code. Runs only if the frontend or the E2E tests
#              changed (backend-only changes are not E2E-tested). On failure the Playwright report (with
#              traces and screenshots) is uploaded as the artifact "playwright-report" and the container logs are printed.
#   cve-scan   Trivy scans the dependencies (pom.xml, package-lock.json) for known vulnerabilities (CVEs). Fails on
#              CRITICAL/HIGH findings that already have a fix, but does not block docker/deploy (informative only).
#              Accepted findings go into .trivyignore in the repository root (one CVE ID per line, with a reason).
#   docker     Docker Buildx builds one image per changed app and pushes it to ghcr.io (not for pull requests);
#              waits for java, frontend and e2e, so a failed E2E test stops the image push and the deploy.
#              Unchanged apps keep their previous image and get no new sha-<commit> tag.
#   deploy     copies compose.prod.yaml to the server via SCP and starts the new images via SSH (master only)
#              (incl. Caddy, the HTTPS entry point; the domain comes from DOMAIN in /opt/hbt/.env on the server)
#
# Variables:
#   steps.filter.outputs.changes   origin: dorny/paths-filter; JSON list of the filters with changed files,
#                                  e.g. ["backend","frontend"]
#   needs.changes.outputs.apps     origin: job "changes"; steps.filter.outputs.changes, for tags and manual runs
#                                  (filter skipped) all apps; matrix of the jobs "java" (without frontend) and "docker",
#                                  condition of the jobs "frontend" and "e2e"
#   steps.e2e-filter.outputs.e2e   origin: dorny/paths-filter; 'true' if files under e2e/ changed
#   needs.changes.outputs.e2e      origin: job "changes"; steps.e2e-filter.outputs.e2e, for tags and manual runs
#                                  (filter skipped) 'true'; condition of the job "e2e"
#   matrix.app                     origin: job matrix; app name = directory under apps/ and image name
#   CI                             origin: set by the runner; makes Playwright forbid test.only and write the HTML report
#   steps.node.outputs.version     origin: apps/frontend/.nvmrc; Node version as build arg NODE_VERSION of the
#                                  frontend image
#   steps.meta.outputs.tags        origin: docker/metadata-action; image tags (latest, sha-<commit>, semver)
#   steps.meta.outputs.labels      origin: docker/metadata-action; OCI labels of the image
#   github.repository, github.actor, github.event_name, github.ref, github.ref_type,
#   github.event.pull_request.user.login
#                                  origin: GitHub Actions context; image path, registry login, conditions
#   GITHUB_OUTPUT                  origin: set by the runner; file for step outputs (Node version)
#   GITHUB_STEP_SUMMARY            origin: set by the runner; file whose Markdown content becomes the job summary,
#                                  receives the result of the CVE scan
#   secrets.GITHUB_TOKEN           origin: provided by GitHub Actions; login to ghcr.io (permission packages: write)
#   secrets.SERVER_HOST            origin: repository secret; host name of the deploy server
#   secrets.SERVER_SSH_KEY         origin: repository secret; private SSH key of the user "deploy" on the server
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter reads the changed files of a pull request via the GitHub API
      pull-requests: read
    outputs:
      # Tags and manual runs skip the filter (empty output) and build all apps
      apps: ${{ steps.filter.outputs.changes || '["backend","users","frontend"]' }}
      e2e: ${{ steps.e2e-filter.outputs.e2e || 'true' }}
    steps:
      - uses: actions/checkout@v7
      # Tags and manual runs build everything, so the filter is skipped. Its log lists the changed files per app.
      - id: filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          # backend/users: their directory and the OpenAPI contract their tests check. frontend: its directory, the
          # npm workspace in the repository root and packages/shared-types (API types generated from the contracts),
          # plus .dockerignore (build context of its image). A change to this workflow rebuilds all apps.
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared-types/openapi/plans.json'
              - '.github/workflows/ci.yml'
            users:
              - 'apps/users/**'
              - 'packages/shared-types/openapi/users.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared-types/**'
              - 'package.json'
              - 'package-lock.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
      # Separate filter, so that "e2e" does not end up in the app list (matrix of the job "docker"). Changed E2E tests
      # run the E2E job without building an image.
      - id: e2e-filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - 'e2e/**'

  java:
    name: ${{ matrix.app }} (build & test)
    needs: [changes]
    if: >-
      contains(fromJSON(needs.changes.outputs.apps), 'backend') ||
      contains(fromJSON(needs.changes.outputs.apps), 'users')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
        # The frontend is tested in its own job "frontend"
        exclude:
          - app: frontend
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/${{ matrix.app }}/pom.xml
      # Includes Testcontainers (PostgreSQL) and the OpenAPI contract check against packages/shared-types/openapi
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (build & test)
    needs: [changes]
    # Job-level condition: a skipped job reports success, so a required check "Frontend (build & test)" does not hang
    if: contains(fromJSON(needs.changes.outputs.apps), 'frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # pretest/prebuild generate the API types in packages/shared-types
      - run: npm test --workspace=frontend -- --watch=false
      - run: npm run build --workspace=frontend

  e2e:
    name: E2E tests (Playwright)
    needs: [changes]
    # Job-level condition: a skipped job reports success, so a required check "E2E tests (Playwright)" does not hang
    if: >-
      contains(fromJSON(needs.changes.outputs.apps), 'frontend') || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # Builds the images from the checked-out code and waits until every container is healthy; the app is then
      # reachable at http://localhost:8080 (default JWT_SECRET from compose.yaml)
      - name: Stack starten
        run: docker compose --profile app up --build --detach --wait
      - run: npm ci
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Container-Logs
        if: failure()
        run: docker compose --profile app logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  cve-scan:
    name: CVE scan (Trivy)
    # Not listed in docker.needs: a finding turns this job red, but images are still built and deployed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/*/pom.xml
      # Trivy reads the transitive Maven dependencies from ~/.m2. Without this step it downloads them itself and
      # gets blocked by Maven Central (429 Too Many Requests).
      - name: Maven-Abhängigkeiten auflösen
        run: for app in backend users; do (cd "apps/$app" && ./mvnw -B -q dependency:resolve); done
      # Pinned to a commit because the tags of trivy-action were compromised and re-pushed in March 2026
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # .cache holds the Trivy database of the action itself
          skip-dirs: .cache
          exit-code: '1'
          output: trivy.txt
      - name: Ergebnis in die Job-Zusammenfassung
        if: always()
        run: |
          { echo '### Trivy: CVEs in den Abhängigkeiten'; echo '```'; cat trivy.txt || echo 'Kein Ergebnis'; echo '```'; } \
            | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    name: Build & push ${{ matrix.app }} image
    needs: [changes, java, frontend, e2e]
    # !failure() && !cancelled(): runs although "java", "frontend" or "e2e" were skipped (app unchanged), but not after a
    # failed test.
    # Dependabot PRs only run the tests, no image build. Without changed files (empty commit) there is nothing to build.
    if: >-
      !failure() && !cancelled() && needs.changes.outputs.apps != '[]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: node
        run: echo "version=$(cat apps/frontend/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          # The frontend needs the npm workspace in the repository root, the Java apps use their own directory
          context: ${{ matrix.app == 'frontend' && '.' || format('apps/{0}', matrix.app) }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy
    needs: [docker]
    # !failure() && !cancelled(): runs although "docker" was skipped (no app changed, e.g. only compose.prod.yaml), but
    # not after a failed job. Unchanged apps keep their image, so their containers are not restarted.
    if: >-
      !failure() && !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compose-Datei auf den Server kopieren
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: compose.prod.yaml
          target: /opt/hbt

      - name: Neue Version starten
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Unchanged apps keep their "latest" image, pulling it is a no-op
          script: |
            set -e
            cd /opt/hbt
            docker compose -f compose.prod.yaml pull backend users frontend caddy
            # --remove-orphans: drops containers of services that no longer exist (e.g. the former "app")
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f
