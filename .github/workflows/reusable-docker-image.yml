# Wiederverwendbarer Workflow: Docker-Image einer App bauen und nach ghcr.io pushen
#
# Auslöser:
#   - workflow_call: wird nur von den App-Workflows (backend.yml, users.yml, frontend.yml) aufgerufen, nie direkt.
#     Der aufrufende Job muss die Berechtigung "packages: write" vergeben.
#
# Ablauf:
#   1. Repository auschecken (actions/checkout)
#   2. Node-Version aus apps/frontend/.nvmrc lesen; wird als Build-Argument übergeben (nur das Frontend nutzt es)
#   3. Docker Buildx einrichten (docker/setup-buildx-action)
#   4. Bei der GitHub Container Registry anmelden (docker/login-action), entfällt bei Pull Requests
#   5. Image-Tags und -Labels bestimmen (docker/metadata-action):
#        Push auf master -> latest, sha-<commit>
#        Git-Tag v1.2.3  -> 1.2.3, 1.2, sha-<commit>
#   6. Image bauen (docker/build-push-action), Layer-Cache im GitHub-Actions-Cache je App;
#      gepusht wird nur außerhalb von Pull Requests
#
# Variablen:
#   inputs.app                  vom aufrufenden Workflow; Verzeichnisname unter apps/, bestimmt Dockerfile, Image-Name
#                               (ghcr.io/<repo>/<app>) und Cache-Scope
#   inputs.context              vom aufrufenden Workflow; Docker-Build-Kontext (apps/<app> bzw. . für das Frontend)
#   github.event_name           von GitHub gesetzt; Name des Auslösers, bei pull_request wird weder angemeldet noch gepusht
#   github.actor                von GitHub gesetzt; Benutzer, der den Lauf ausgelöst hat, Login-Name für ghcr.io
#   github.repository           von GitHub gesetzt; "<owner>/<repo>", Präfix des Image-Namens
#   secrets.GITHUB_TOKEN        von GitHub pro Lauf erzeugt; Passwort für ghcr.io (Rechte vom aufrufenden Job)
#   steps.node.outputs.version  aus Schritt "node"; Inhalt von apps/frontend/.nvmrc, Build-Argument NODE_VERSION
#   steps.meta.outputs.tags     aus Schritt "meta"; Liste der Image-Tags für build-push-action
#   steps.meta.outputs.labels   aus Schritt "meta"; OCI-Labels (Quelle, Commit, ...) für build-push-action
#   {{is_default_branch}}       Ausdruck von docker/metadata-action (keine GitHub-Variable); wahr auf master

name: Docker image

on:
  workflow_call:
    inputs:
      app:
        description: Verzeichnisname der App unter apps/, z. B. backend
        required: true
        type: string
      context:
        description: Docker-Build-Kontext, z. B. apps/backend oder . (Repository-Wurzel)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push ${{ inputs.app }} image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: node
        run: echo "version=$(cat apps/frontend/.nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,scope=${{ inputs.app }},mode=max
